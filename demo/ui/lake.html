<!doctype html><meta charset=utf-8><title>Data lake — ULPF</title><link rel=stylesheet href=theme.css>
<header><span class=brand>ULPF<small>Data lake</small></span>
<a class=pill id=nav1 href="http://127.0.0.1:8780/">Generator</a><a class=pill href="/">System</a><a class="pill here" href="/lake">Data lake</a><a class=pill id=navsiem href="http://127.0.0.1:5601/app/dashboards#/view/ulpf-overview" target=_blank>SIEM ↗</a></header>
<main>
<div class=row>
 <div class=panel><h2>In the lake</h2><div id=sources></div></div>
 <div class=panel style="flex:0 0 380px"><h2>Find an event</h2><div class=btns><input id=q placeholder="ev_…" style="flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit"><button onclick="look($('q').value.trim())">Find</button></div></div>
</div>
<div class=panel><h2>Latest events <span class=lab id=upd style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
 <div class=scroll><table><thead><tr><th>time</th><th>source</th><th>format</th><th>class</th><th>source → destination</th><th>action</th><th>event</th></tr></thead><tbody id=rows></tbody></table></div></div>
<div class=row id=detail style="display:none">
 <div class=panel><h2>Raw log</h2><pre class=raw id=d_raw></pre><h2 style="margin-top:14px">Format</h2><div id=d_fmt></div><h2 style="margin-top:14px">Where it is stored</h2><div id=d_where class=lab></div></div>
 <div class=panel><h2>Normalized (OCSF)</h2><div id=d_norm></div></div>
</div>
</main>
<script>
Object.defineProperty(HTMLElement.prototype,'html',{set(h){if(this._h!==h){this.innerHTML=h;this._h=h}}});
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACT={1:'allowed',2:'denied'};
let sel=null;
fetch('/api/state').then(r=>r.json()).then(S=>{if(S.mode=='devices'){$('nav1').style.display='none';$('navsiem').href='http://127.0.0.1:5601/app/dashboards#/view/ulpf-real-devices'}}).catch(()=>{});
async function tick(){let d;try{d=await (await fetch('/api/lake')).json()}catch(e){return}
 $('sources').html=d.error?`<div class="alert bad">${esc(d.error)}</div>`:(d.sources.map(s=>`<div style="margin-bottom:6px"><b>${esc(s.source.replace('ulpf_','').replace(/_/g,' '))}</b> <span class=lab>${s.days.reduce((n,x)=>n+x.rows,0)} rows · ${s.files} files · ${s.distinct_schemas==1?'<span class=ok>one schema</span>':'<span class=bad>'+s.distinct_schemas+' schemas</span>'}</span></div>`).join('')||'<span class=dim>nothing written yet</span>');
 const w=d.writer;
 $('upd').html=`· updated ${new Date().toLocaleTimeString()}${w?` · ${w.staged_rows} waiting for the next file (written every ${d.rotate_seconds||10} s)`:' · <span class=bad>lake writer not answering</span>'}`;
 $('rows').html=d.latest.map(r=>`<tr class="click ${r.event_id==sel?'sel':''}" onpointerdown="look('${r.event_id}')"><td class=m>${r.time?new Date(r.time).toLocaleTimeString():''}</td><td>${esc((r.source||'').replace(/\s*\(.*\)$/,''))}</td><td>${r.format?`<span class="tag blue">${esc(r.format.split(' → ').pop())}</span>`:'<span class=dim>—</span>'}</td><td class=lab>${esc(r.class)}</td><td class=m>${r.src?esc(r.src)+' → '+esc(r.dst):''}</td><td>${esc(ACT[r.action_id]||r.action_id||'')}</td><td class="m dim">${esc(r.event_id.slice(0,14))}…</td></tr>`).join('')||'<tr><td colspan=7 class=dim>no rows yet</td></tr>';}
async function look(id){if(!id)return;sel=id;$('q').value=id;
 const [l,d]=await Promise.all([fetch('/api/lake?event_id='+encodeURIComponent(id)).then(r=>r.json()),fetch('/api/log?id='+encodeURIComponent(id)).then(r=>r.ok?r.json():null).catch(()=>null)]);
 $('detail').style.display='';
 $('d_raw').textContent=d&&d.raw?d.raw.text:'(the raw log is in the evidence log; this console has no record of the event)';
 $('d_fmt').html=d&&d.format?`<div class=big style="font-size:1.4rem">${esc(d.format.surface||'—')}</div><div class=lab>${esc(d.format.envelope)}</div>`:'<span class=dim>unknown</span>';
 const h=l.lookup;$('d_where').html=h?`<span class=mono>${esc(h.file)}</span><br>evidence: <span class=mono>${esc(h.segment_id)} + ${h.offset}</span> · ${esc(h.raw_hash.slice(0,23))}…<br>parser: <span class=mono>${esc(h.parser_id)}</span>`:'<span class=amber>not in a Parquet file yet</span>';
 $('d_norm').html=d&&d.parsed&&d.parsed.event?`<pre class=json>${esc(JSON.stringify(d.parsed.event,null,2))}</pre>`:'<span class=dim>—</span>';
 tick()}
tick();setInterval(tick,3000);
</script>
