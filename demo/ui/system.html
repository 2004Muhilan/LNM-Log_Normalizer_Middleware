<!doctype html><meta charset=utf-8><title>System — ULPF</title><link rel=stylesheet href=theme.css>
<header><span class=brand>ULPF<small>System</small></span>
<a class=pill id=nav1 href="http://127.0.0.1:8780/">Generator</a><a class="pill here" href="/">System</a><a class=pill href="/lake">Data lake</a><a class=pill id=navsiem href="http://127.0.0.1:5601/app/dashboards#/view/ulpf-overview" target=_blank>SIEM ↗</a></header>
<main>
<div class=row id=devsec style="display:none"></div>
<div id=needs></div>
<div id=alerts></div>
<div class=row>
 <div class=panel><h2>Sources</h2><table><thead><tr><th>source</th><th>events</th><th>status</th></tr></thead><tbody id=apps></tbody></table></div>
 <div class=panel style="flex:0 0 340px"><h2>Runtime</h2><div id=rt></div></div>
</div>
<div class=row id=dests></div>
<div id=jobs></div>
<div id=logsec style="display:none">
 <div class=panel><h2 id=logtitle></h2><div class=scroll style="max-height:300px"><table><thead><tr><th>time</th><th>format</th><th>result</th><th>raw log</th></tr></thead><tbody id=logs></tbody></table></div></div>
 <div class=row id=detail style="display:none">
  <div class=panel><h2>Raw log</h2><pre class=raw id=d_raw></pre><p class=lab id=d_rawmeta></p><h2 style="margin-top:14px">Format</h2><div id=d_fmt></div></div>
  <div class=panel><h2 id=d_title>Normalized (OCSF)</h2><div id=d_parsed></div></div>
 </div>
</div>
<div class=row>
 <div class=panel id=findsec><h2>SIEM findings</h2><table><tbody id=finds></tbody></table></div>
 <div class=panel id=tracesec style="display:none"><h2>Prove it</h2><div id=trace></div></div>
</div>
<details class=panel id=more><summary><h2 style="display:inline">More — parser log, evidence archive, policy</h2></summary>
 <div id=policy class=btns style="margin:10px 0"></div><div id=arch></div><div id=tlog style="margin-top:12px"></div></details>
</main>
<script>
Object.defineProperty(HTMLElement.prototype,'html',{set(h){if(this._h!==h){this.innerHTML=h;this._h=h}}}); // re-render only what changed
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(p,d)=>fetch(p,{method:'POST',body:JSON.stringify(d)}).then(r=>r.ok?tick():r.text().then(t=>alert(t)));
let host=null, sel=null, S=null, proving=null, showRetired=false;
const STATE={starting:'starting',sampling:'sampling',model:'labelling',answering:'needs answers',promoting:'promoting',waiting_approval:'waiting',asking:'needs answers',done:'done',failed:'failed'};
const KIND={heal:'Self-healing',drift:'Drift',discovery:'New family',onboard:'Onboarding'};
const lbl=p=>'Process '+(p.label??p.process);
const vmapNeeded=(f,a)=>!!a&&/_id$/.test(a)&&(f.samples||[]).some(v=>!/^-?\d+$/.test(String(v).trim()));
const vmapHint=f=>'value map: '+[...new Set(f.samples||[])].slice(0,2).map((v,i)=>v+'='+(i+1)).join(', ');
const dups=j=>{const c={};for(const a of Object.values(j.answers||{}))if(a&&a!='unmapped')c[a]=(c[a]||0)+1;return Object.keys(c).filter(a=>c[a]>1)};
const why=j=>{const t=((j.steps||[]).slice(-1)[0]||{}).text||'';return /mapped more than once/.test(t)?'an attribute was used for more than one field':/fail to parse/.test(t)?'answers that do not fit the values':(t.split('\n').filter(l=>l.trim()).pop()||'').replace(/^.*Error: /,'').slice(0,140)};
const nm=t=>String(t||'').replace(/\s*\(.*\)$/,''), fmtShort=f=>String(f||'').split(' → ').pop();
const short=t=>{t=String(t||'').split(' — ')[0].replace(/\s*\(.*?\)/g,'');return t.length>110?t.slice(0,107)+'…':t};
const scaleMsg=x=>!x.ok?x.outcome:x.action=='add'?`Process ${x.label??x.process} added`:`Process ${x.label??x.process} removed`+(/ 0 parsed event\(s\) not delivered, 0 segment/.test(x.outcome)?' — nothing left behind':' — '+x.outcome.split(': ').slice(1).join(': '));
function jobHtml(j){
 const open=!['done','failed'].includes(j.state), ask=j.state=='answering'||j.state=='asking';
 let h=`<details class=panel id="job-${j.id}" ${open?'open':''}><summary><h2 style="display:inline">${KIND[j.kind]||'Onboarding'} · ${esc(nm(j.app))} · ${esc(fmtShort(j.format))}</h2> <span class="tag ${j.state=='done'?'ok':j.state=='failed'?'bad':''}">${STATE[j.state]||j.state}</span></summary>`;
 if(j.state=='waiting_approval')h+=`<p><button class=go onclick="post('/api/approve',{job:'${j.id}'})">Onboard this format</button></p>`;
 const asked=f=>!f.evidenced||(f.field in (j.answers||{})), need=j.fields.filter(f=>!f.evidenced&&!(f.field in (j.answers||{}))), shown=ask?j.fields.filter(asked):j.fields, rest=ask?j.fields.filter(f=>!asked(f)):[];
 const prop=f=>(f.mapped.concat(f.candidates||[]))[0]||'';
 const row=f=>{
   const needs=ask&&asked(f), k=j.id+'/'+f.field;
   const how=f.propagated?'carried over':f.ambiguity?'ambiguous':f.evidenced?'':'proposed';
   const twice=dups(j).includes((j.answers||{})[f.field]);
   return `<tr${twice?' style="background:#2d1214"':''}><td class=m>${esc(f.field)}${twice?' <span class="tag bad">used twice</span>':''}</td><td class="m dim">${esc((f.samples||[])[0]||'')}</td><td class=m>${(j.answers||{})[f.field]=='unmapped'?'<span class=dim>unmapped</span>':f.evidenced?esc(f.mapped.join(', ')):`<span class=amber>?</span>${prop(f)?` <span class=dim>proposed: ${esc(prop(f))}</span>`:''}`}${f.evidenced&&how?` <span class=dim>${how}</span>`:''}</td>
   ${ask?`<td>${needs?`<select onchange="this.blur();post('/api/answer',{job:'${j.id}',field:'${f.field}',attribute:this.value})"><option value="">choose…</option><option value="unmapped" ${(j.answers||{})[f.field]=='unmapped'?'selected':''}>— leave unmapped —</option>${S.attributes.map(a=>`<option ${(j.answers||{})[f.field]==a?'selected':''}>${a}</option>`).join('')}</select>${vmapNeeded(f,j.answers[f.field])?`<div style="margin-top:4px"><input class=vmap size=24 placeholder="${esc(vmapHint(f))}" title="the value map onto ${esc(j.answers[f.field])}: text value = code" onchange="this.blur();post('/api/answer',{job:'${j.id}',field:'${f.field}',attribute:'${j.answers[f.field]}',lookup:this.value})"></div>`:''}`:''}</td>`:''}</tr>`};
 const table=(fs,a)=>`<table style="margin-top:6px"><thead><tr><th>field</th><th>sample</th><th>maps to</th>${a?'<th>answer</th>':''}</tr></thead><tbody>${fs.map(row).join('')}</tbody></table>`;
 if(j.fields.length&&(open||j.kind=='heal')){
  if(ask)h+=`<div class=lab style="margin-top:6px">${need.length} field${need.length==1?'':'s'} to answer${rest.length?` · ${rest.length} already known`:''} · fields left unanswered are carried unmapped</div>`;
  if(shown.length&&(open||ask))h+=table(shown,ask);
  if(rest.length)h+=`<details style="margin-top:6px"><summary class=lab>the ${rest.length} known field${rest.length==1?'':'s'}</summary>${table(rest,false)}</details>`;
  else if(!open)h+=table(j.fields,false)}
 if((j.certificates||[]).length&&open)h+=`<div class=lab style="margin-top:8px">Certificates: ${j.certificates.map(c=>`<span class="tag ${c.status=='resolved'?'ok':''}" title="${esc(c.candidates.join(' | '))}">${esc(c.field)} · ${esc((c.ambiguity||'').replace(/_/g,' '))}</span>`).join(' ')}</div>`;
 if(ask){const B=j.blockers||[], miss=B.filter(b=>/mandatory/.test(b)), bad=B.find(b=>/fail to parse/.test(b)), dup=dups(j);
  h+=`${miss.length?`<div class=amber style="margin-top:8px">Before promoting: ${esc(miss.map(b=>b.replace(/^.*mandatory attribute (\S+).*$/,'$1')).join(', '))} must be answered</div>`:''}
  ${dup.length?`<div class=bad style="margin-top:4px">${esc(dup.join(', '))} ${dup.length==1?'is':'are'} chosen for more than one field — each attribute can be used once</div>`:''}
  ${bad?`<div class=amber style="margin-top:4px">${esc(bad)}: an answer does not fit its values (e.g. text mapped to an address, a number to a time) — change it or leave the field unmapped</div>`:''}
  <div class=btns style="margin-top:8px"><button onclick="useProposals('${j.id}')" ${need.some(f=>prop(f))?'':'disabled'}>Use the model's proposals</button><button class=go ${dup.length?'disabled':''} onclick="post('/api/promote',{job:'${j.id}'})">${j.state=='asking'?'Apply answers':'Promote'}</button></div>`}
 h+=`<details style="margin-top:6px"><summary class=lab>steps</summary><ol class=steps>${j.steps.map(s=>`<li><span class="dim mono">${s.at}</span> ${esc(s.text)}</li>`).join('')}</ol></details>`;
 return h+'</details>'}
async function tick(){try{S=await (await fetch('/api/state')).json()}catch(e){return}
 $('needs').html=S.jobs.filter(j=>['waiting_approval','answering','asking'].includes(j.state)).map(j=>`<div class=alert style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><b>${esc(nm(j.app))}</b><span>${j.state=='waiting_approval'?'new format: '+esc(fmtShort(j.format)):esc(fmtShort(j.format))+' — '+j.fields.filter(f=>!f.evidenced).length+' field(s) to answer'}</span>
   ${j.state=='waiting_approval'?`<button class=go onclick="post('/api/approve',{job:'${j.id}'})">Onboard this format</button>`:`<button onclick="document.getElementById('job-${j.id}').scrollIntoView({behavior:'smooth'})">Answer</button>`}</div>`).join('')
  +S.jobs.filter((j,i)=>j.state=='failed'&&!S.jobs.slice(i+1).some(k=>k.host==j.host&&k.format==j.format&&k.state=='done')).slice(-2).map(j=>`<div class="alert bad"><b>${esc(nm(j.app))}</b> ${esc(fmtShort(j.format))} — onboarding failed: ${esc(why(j))}. A new job starts by itself.</div>`).join('');
 const dm=S.mode=='devices';
 $('nav1').style.display=dm?'none':''; $('navsiem').href=dm?'http://127.0.0.1:5601/app/dashboards#/view/ulpf-real-devices':'http://127.0.0.1:5601/app/dashboards#/view/ulpf-overview';
 const a0=S.alerts[S.alerts.length-1];
 $('alerts').html=a0?`<div class="alert ${a0.outcome.startsWith('healed')?'ok':''}"><b>${a0.outcome.startsWith('heal')?'Drift healed':'Format change'} · ${esc((a0.app||'').replace(/\s*\(.*\)$/,''))} · ${esc(a0.format)}</b> <span class=dim>${esc(isNaN(Date.parse(a0.at))?a0.at:new Date(a0.at).toLocaleTimeString())}</span> — ${esc(short(a0.outcome))}${a0.pack&&!a0.rolled_back?` <button onclick="post('/api/rollback',{alert:'${a0.id}'})" style="padding:2px 10px;margin-left:8px">Roll back</button>`:''}</div>`:'';
 const live=S.processes.filter(p=>p.state!='retired');
 $('apps').html=S.apps.map(a=>`<tr class="click ${a.host==host?'sel':''}" onpointerdown="host='${a.host}';sel=null;tick()"><td><span class="dot ${a.connected?'ok':''}"></span><b>${esc((a.name||'').replace(/\s*\(.*\)$/,''))}</b><div class="lab mono">${esc(a.host)}</div></td>
   <td class=m>${a.usable}${a.quarantined?` <span class=amber>· ${a.quarantined} quarantined</span>`:''}</td>
   <td class=lab>${a.connected?'sending':'silent'}${live.length>1&&(a.process_labels||[]).length?' · process '+a.process_labels.join(', '):''}</td></tr>`).join('')||'<tr><td colspan=3 class=dim>nothing received yet</td></tr>';
 const c=S.scaling||{}, retired=S.processes.filter(p=>p.state=='retired'), last=(c.history||[]).slice(-1)[0];
 $('rt').html=`<div><span class="dot ${S.runtime.up?'ok':'bad'}"></span>${S.runtime.up?'Running':'DOWN'} · parse success <b>${S.parse_success==null?'—':Math.round(S.parse_success*100)+'%'}</b></div>
   <table style="margin-top:6px"><tbody>${live.sort((x,y)=>(x.label??x.process)-(y.label??y.process)).map(p=>`<tr><td><span class="dot ${p.up?'ok':'bad'}"></span>${lbl(p)}${p.state!='running'?` <span class=amber>${esc(p.state)}</span>`:''}</td><td class=m>${p.events}</td></tr>`).join('')}</tbody></table>
   ${c.available?`<div class=btns style="margin-top:8px"><button onclick="scaleAct('add')" ${c.busy||c.live>=c.limit?'disabled':''}>Add process</button><button onclick="scaleAct('remove')" ${c.busy||c.live<=1?'disabled':''}>Remove process</button>${retired.length?`<button onclick="showRetired=!showRetired;tick()">${showRetired?'Hide':'Show'} retired (${retired.length})</button>`:''}</div>
     ${c.busy?`<div class="amber lab" style="margin-top:4px">${esc(c.busy)}</div>`:last?`<div class="lab ${last.ok?'':'bad'}" style="margin-top:4px">${esc(scaleMsg(last))}</div>`:''}
     ${showRetired&&retired.length?`<table style="margin-top:6px"><tbody>${retired.map(p=>`<tr class=dim><td>${lbl(p)} · retired ${esc(p.retired_at||'')}</td><td class=m>${p.events}</td></tr>`).join('')}</tbody></table>`:''}
     ${c.address_warning?`<div class="alert bad" style="margin:6px 0 0">${esc(c.address_warning)}</div>`:''}`:''}`;
 const siem=S.egress.find(e=>e.kind=='siem');
 $('dests').html=S.egress.map(e=>{const s=e.kind=='siem';
   const btn=s?(S.siem_action?`<span class=amber>${esc(S.siem_action)}…</span>`:e.up?`<button class=danger onclick="post('/api/siem',{action:'outage'})">Stop (outage)</button>`:`<button class=go onclick="post('/api/siem',{action:'recover'})">Start</button>`)
     :(dm?(S.lake_writers?`<button onclick="post('/api/lake-control',{action:'disconnect'})">Disconnect</button>`:`<button class=go onclick="post('/api/lake-control',{action:'connect'})">Connect</button>`):'');
   return `<div class=panel><h2>${s?'SIEM — OpenSearch':'Data lake — Parquet'} ${e.ui?`<a class=pill style="padding:1px 8px;font-size:.75rem" href="${esc(e.ui)}" ${e.ui.startsWith('http')?'target=_blank':''}>open ↗</a>`:''}</h2>
   <div class=big style="font-size:1.8rem"><span class="${e.up?'ok':'bad'}">${e.up?'UP':'DOWN'}</span>${e.ahead_by?` <span style="font-size:1rem;color:${e.ahead_by>20?'var(--red)':'var(--amber)'}">${e.ahead_by} waiting</span>`:''}</div>
   <div class=lab>${e.delivered} delivered</div>
   ${e.rejected?`<div class="alert bad" style="margin:6px 0 0;padding:6px 10px">${e.rejected} rejected by the destination</div>`:''}${e.skipped?`<div class="alert bad" style="margin:6px 0 0;padding:6px 10px">${e.skipped} skipped (spool full)</div>`:''}
   <div class=btns style="margin-top:8px">${btn}</div></div>`}).join('');
 devices();
 const isOpen=j=>!['done','failed'].includes(j.state);
 const done=S.jobs.filter(j=>!isOpen(j)).reverse();
 const W=j=>['waiting_approval','answering','asking'].includes(j.state)?0:1;
 const busyEl=document.activeElement, editing=busyEl&&['SELECT','INPUT'].includes(busyEl.tagName)&&$('jobs').contains(busyEl);
 if(!editing)$('jobs').html=S.jobs.filter(isOpen).reverse().sort((x,y)=>W(x)-W(y)).map(jobHtml).join('')+(done.length?`<details class=panel><summary><h2 style="display:inline">Finished (${done.length})</h2></summary>${done.map(j=>`<div class=lab style="margin:4px 0">${KIND[j.kind]||'Onboarding'} · ${esc(j.app||'')} · ${esc(j.format||'')} — <span class="${j.state=='done'?'ok':'bad'}">${j.state}</span>${j.pack?' · '+esc(j.pack.pack_id)+' v'+esc(j.pack.pack_version):''}</div>`).join('')}</details>`:'');
 $('policy').html=`<span class=lab style="align-self:center">Answers for a new format:</span><button class="${S.policy.prepared_answers?'on':''}" onclick="post('/api/policy',{prepared_answers:true})">Prepared sheet</button><button class="${S.policy.prepared_answers?'':'on'}" onclick="post('/api/policy',{prepared_answers:false})">Ask me</button>
  <span class=lab style="align-self:center;margin-left:14px">New sources:</span><button class="${S.policy.auto_onboard?'':'on'}" onclick="post('/api/policy',{auto_onboard:false})">Wait for me</button><button class="${S.policy.auto_onboard?'on':''}" onclick="post('/api/policy',{auto_onboard:true})">Onboard automatically</button>${S.runtime.relay_available?`<button class="${S.policy.vendor_relay?'on':''}" style="margin-left:14px" onclick="post('/api/policy',{vendor_relay:${!S.policy.vendor_relay}})">Four-vendor relay: ${S.policy.vendor_relay?'ON':'OFF'}</button>`:''}`;
 const A=S.archive||{}, mb=b=>(b/1048576).toFixed(1)+' MB';
 $('arch').html=A.configured?`<div class=lab>Evidence archive: ${A.shipped_segments} segments shipped (${mb(A.archived_bytes)}), ${A.pending_segments} pending, local buffer ${mb(A.local_bytes)} of ${mb(A.cap)} · committer ${A.committer?'<span class=ok>running</span>':'<span class=bad>not running</span>'}</div>`:'<div class=bad>No evidence archive configured</div>';
 if(host){$('logsec').style.display='';const a=S.apps.find(x=>x.host==host);$('logtitle').textContent='Logs — '+(a?a.name:host);
  const rows=await (await fetch('/api/logs?host='+host)).json();
  $('logs').html=rows.map(r=>`<tr class="click ${r.event_id==sel?'sel':''}" onpointerdown="show('${r.event_id}')"><td class=m>${r.ms?new Date(r.ms).toLocaleTimeString():r.at}</td><td>${esc(r.format)}</td><td>${r.ok?'<span class="tag ok">parsed</span>':r.ok===false?'<span class=tag>quarantined</span>':'<span class=dim>…</span>'}</td><td class="m dim">${esc(r.preview)}</td></tr>`).join('');}}
function devices(){const D=S.devices;
 if(S.mode!='devices'||!D){$('devsec').style.display='none';return}
 $('devsec').style.display='';const st=D.status||{}, dis=D.busy?'disabled':'';
 const app=h=>S.apps.find(a=>a.host==h)||{}, fa=app('172.20.20.2'), ia=app('172.20.20.11');
 const state=(on,a)=>a.connected?`<span class=ok><span class="dot ok"></span>sending · ${a.events} events</span>`:on?'<span class=amber><span class="dot amber"></span>connecting…</span>':'<span class=dim><span class=dot></span>not connected</span>';
 const fmt=D.format||st.syslog_format||'default', last=(D.history||[]).slice(-1)[0];
 $('devsec').html=`<div class=panel><h2>FortiGate firewall ${st.licence_valid?'':'<span class="tag bad">licence not valid</span>'}</h2><div>${state(st.fgt_syslog_on,fa)}</div>
   <div class=btns style="margin-top:8px"><button class=go ${dis} onclick="dev('fgt-connect')">Connect</button><button ${dis} onclick="dev('fgt-disconnect')">Disconnect</button></div>
   <div class=lab style="margin-top:8px">log format</div><div class=btns>${['default','json','csv','cef'].map(f=>`<button class="${fmt==f?'on':''}" ${dis} onclick="dev('fgt-format','${f}')">${f=='default'?'Default':f.toUpperCase()}</button>`).join('')}</div></div>
  <div class=panel><h2>Suricata IDS</h2><div>${state(st.ids_forwarder_on,ia)}</div>
   <div class=btns style="margin-top:8px"><button class=go ${dis} onclick="dev('ids-connect')">Connect</button><button ${dis} onclick="dev('ids-disconnect')">Disconnect</button></div></div>
  <div class=panel style="flex:0 0 280px"><h2>Lab traffic</h2><div class=btns><button class=danger ${dis} onclick="dev('attack')">Send attack traffic</button></div>
   <div class=lab style="margin-top:8px">${D.busy?`<span class=amber>${esc(D.busy)}…</span>`:last?`last: ${esc(last.action)} — <span class="${last.rc?'bad':'ok'}">${last.rc?'failed':'ok'}</span>`:''}</div></div>`;}
function dev(action,arg){fetch('/api/device',{method:'POST',body:JSON.stringify({action,arg})}).then(r=>r.ok?tick():r.text().then(t=>alert(t)))}
async function show(id){sel=id;const d=await (await fetch('/api/log?id='+id)).json();$('detail').style.display='';
 $('d_raw').textContent=d.raw.text;
 $('d_rawmeta').html=`${d.raw.bytes} bytes from <span class=mono>${esc(d.raw.peer)}</span> · <span class="${d.raw.hash_verified_now?'ok':'bad'}">${d.raw.hash_verified_now?'hash verified':'HASH MISMATCH'}</span>`;
 const f=d.format;$('d_fmt').html=`<div class=big style="font-size:1.4rem">${esc(f.surface||'—')}</div><div class=lab>${esc(f.envelope)}</div>`;
 const p=d.parsed;$('d_title').textContent=p.status=='normalized'?'Normalized (OCSF)':'Not normalized';
 $('d_parsed').html=p.status=='normalized'?`<p class=lab>${esc(p.pack)} v${esc(p.pack_version)}</p><pre class=json>${esc(JSON.stringify(p.event,null,2))}</pre>
   <p><button class=go onclick="prove('${id}')">Prove it</button></p>`
   :p.status=='quarantined'?`<div class=alert><b>Quarantined</b> — ${esc(p.reason)}<br><span class=lab>The bytes are kept; nothing was guessed.</span></div>`:'<span class=dim>in flight</span>';
 tick()}
async function finds(){let F=[];try{F=await (await fetch('/api/findings')).json()}catch(e){}
 $('finds').html=F.slice(0,6).map(f=>`<tr><td>${esc(f.rule)}</td><td class=m>${new Date(f.at).toLocaleTimeString()}</td><td><button onclick="prove('${f.event_ids[0]}')">Prove it</button></td></tr>`).join('')||'<tr><td class=dim>none yet</td></tr>';
 if(proving){const t=await (await fetch('/api/trace?id='+proving)).json();$('tracesec').style.display='';
  $('trace').html=t?`<div class="${t.ok?'ok':'bad'}" style="font-weight:700;margin-bottom:6px">${t.ok?'PROVEN':'INCOMPLETE'} <span class="mono dim" style="font-weight:400">${esc(t.event_id)}</span></div>
   <ol class=steps>${t.steps.map(s=>`<li title="${esc(s.detail)}"><span class="${s.ok?'ok':'bad'}">${s.ok?'✓':'✗'}</span> ${esc(s.step)}</li>`).join('')}</ol>
   ${t.steps.some(s=>s.bundle)?`<div class=btns style="margin-top:8px"><a class=pill target=_blank href="/certificate?id=${esc(t.event_id)}">BSA §63(4) certificate — draft</a><a class=pill href="/api/bundle?id=${esc(t.event_id)}">Download proof</a></div>`:''}`:`<span class=amber>proving…</span>`;}}
async function tlogv(){let T;try{T=await (await fetch('/api/tlog')).json()}catch(e){return}
 const live=(S&&S.processes||[]).filter(p=>p.state=='running');
 $('tlog').html=`<div class=lab>Parser transparency log: ${(T.entries||[]).length} packs · the runtime loads only logged packs</div>
  <div class=btns style="margin:6px 0">${live.map(p=>`<button onclick="pushUnlogged(${p.process})">Push an unlogged pack to ${lbl(p)}</button>`).join('')}</div>
  ${(T.refusals||[]).length?`<div class="alert bad" style="margin:4px 0">${T.refusals.slice(-3).reverse().map(r=>`<div><b>Refused</b> ${esc(r.pack)} — recorded in the evidence log</div>`).join('')}</div>`:''}
  <table><thead><tr><th>pack</th><th>version</th><th>produced</th><th>logged</th></tr></thead><tbody>${(T.entries||[]).slice(0,12).map((e,i,a)=>`<tr><td>${esc(e.PackID)}${e.active&&!a.slice(0,i).some(x=>x.PackID==e.PackID&&x.PackVersion==e.PackVersion)?' <span class="tag ok">active</span>':''}</td><td class=m>${esc(e.PackVersion)}</td><td>${esc(e.ProducedBy)}</td><td class=m>${esc((e.LoggedAt||'').replace('T',' ').replace('Z',''))}</td></tr>`).join('')}</tbody></table>`}
async function useProposals(id){const j=S.jobs.find(x=>x.id==id);if(!j)return;
 for(const f of j.fields.filter(f=>!f.evidenced&&!(f.field in (j.answers||{})))){const a=(f.mapped.concat(f.candidates||[]))[0];if(a&&S.attributes.includes(a))await fetch('/api/answer',{method:'POST',body:JSON.stringify({job:id,field:f.field,attribute:a,via:'proposal'})})}
 tick()}
async function scaleAct(a){const r=await fetch('/api/scale',{method:'POST',body:JSON.stringify({action:a})});if(!r.ok)alert(await r.text());tick()}
async function pushUnlogged(i){const r=await (await fetch('/api/push-unlogged',{method:'POST',body:JSON.stringify({process:i})})).json();alert((r.refused?'Refused: ':'NOT refused: ')+r.pack);tlogv()}
function prove(id){proving=id;$('tracesec').style.display='';$('trace').html='<span class=amber>proving…</span>';fetch('/api/prove',{method:'POST',body:JSON.stringify({event_id:id})});finds();$('tracesec').scrollIntoView({behavior:'smooth'})}
tick();setInterval(tick,900);finds();setInterval(finds,3000);tlogv();setInterval(tlogv,5000);
</script>
