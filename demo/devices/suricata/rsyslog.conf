# fgt-ids-syslog: receives Suricata's EVE over the shared /dev/log socket and forwards it to ULPF over TCP, framed by
# RFC 6587 octet counting, as RFC 3164 lines: "<PRI>Mmm dd hh:mm:ss suricata-ids suricata[PID]: {EVE JSON}".
global(maxMessageSize="64k")
module(load="imuxsock" SysSock.Use="off")
input(type="imuxsock" Socket="/run/ulpf-log/log" CreatePath="on" HostName="suricata-ids")
action(type="omfwd" target="172.20.20.1" port="6515" protocol="tcp" TCP_Framing="octet-counted"
       template="RSYSLOG_TraditionalForwardFormat"
       queue.type="LinkedList" queue.size="20000" action.resumeRetryCount="-1" action.resumeInterval="5")
